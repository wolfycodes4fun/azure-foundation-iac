---
- name: Configure AZ VMs for service deployments
  hosts: backendservers
  become: true
  gather_facts: true

  tasks:
    - name: Remove older Docker versions if available
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - docker-buildx
          - podman-docker
        state: absent
        purge: true

    - name: Install pre-requisite packages
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
        state: present
        update_cache: yes
    
    - name: Create apt keyrings for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    
    - name: Download Docker's GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
    
    - name: Add Docker repository to APT sources
      ansible.builtin.deb822_repository:
        name: Docker
        types: [deb]
        uris:
          - https://download.docker.com/linux/ubuntu
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures:
          - "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
    
    - name: Install Docker Engine & NGINX
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - nginx
        state: present
        update_cache: yes
    
    - name: Ensure Docker & NGINX run on boot
      ansible.builtin.systemd_service:
        name: "{{ item  }}"
        state: started
        enabled: yes
      loop:
        - docker
        - nginx
