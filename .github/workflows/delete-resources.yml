---
name: Environment Delete Pipeline

on:
  workflow_dispatch:

jobs:
  delete-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
      
      - name: Initialize Terraform
        run: |
          ls -l
          cd environments/dev/
          terraform init -reconfigure
      
      - name: Run Terraform Destroy
        env:
          TF_VAR_admin_username: ${{ secrets.AZURE_VM_ADMIN_USERNAME }}
          TF_VAR_ssh_public_key: ${{ secrets.PUBLIC_SSH_KEY }}
        run: |
          cd environments/dev/
          terraform apply -destroy -auto-approve
      
      - name: Revoke Storage Blob Data Contributor role from SPN
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          STORAGE_ACCOUNT_CONTAINER_NAME: ${{ vars.STORAGE_ACCOUNT_CONTAINER_NAME }}
        with:
          azcliversion: latest
          inlineScript: |
            storage_account_id=$(az storage account show \
              --name "$STORAGE_ACCOUNT_NAME" \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --query id \
              --output tsv)
            container_id="${storage_account_id}/blobServices/default/containers/${STORAGE_ACCOUNT_CONTAINER_NAME}"

            source "${GITHUB_WORKSPACE}/scripts/helper-funcs/role-revokes.sh"
            revoke_role "Storage Blob Data Contributor" "$container_id"
      
      # Upload artifact containing scripts to destroy storage account
      - name: Upload Scripts Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: scripts/delete-tf-storage-acc.sh
          retention-days: 1

  delete-storage-account:
    needs: delete-environment
    runs-on: ubuntu-latest
    steps:
      - name: Download Scripts Artifact
        uses: actions/download-artifact@v4
        with:
          name: scripts
          path: .

      - name: Delete Storage Account
        env:
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
        run: |
          chmod +x delete-tf-storage-acc.sh
          ./delete-tf-storage-acc.sh
      
      - name: Revoke Contributor role from SPN
        uses: azure/cli@v2
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          azcliversion: latest
          inlineScript: |
            source "${GITHUB_WORKSPACE}/scripts/helper-funcs/role-revokes.sh"
            revoke_role "Contributor" "/subscriptions/${SUBSCRIPTION_ID}"
