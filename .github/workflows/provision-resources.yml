---
name: Environment Create Pipeline

on:
  workflow_dispatch:

jobs:
  create-storage-account:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: |
          cd scripts/
          chmod +x *.sh

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Grant Contributor Role to SPN
        uses: azure/cli@v2
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          azcliversion: latest
          inlineScript: |
            source "$GITHUB_WORKSPACE/scripts/helper-funcs/role-grants.sh"
            grant_role "Contributor" "/subscriptions/${SUBSCRIPTION_ID}" 
      
      - name: Provision Storage Account
        env:
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          REGION: ${{ vars.REGION }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          STORAGE_ACCOUNT_CONTAINER_NAME: ${{ vars.STORAGE_ACCOUNT_CONTAINER_NAME }}
        run: |
          cd scripts/
          ./initialize-container-remote-be.sh

  provision-environment:
    needs: create-storage-account
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Grant Storage Blob Data Contributor role to SPN
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          STORAGE_ACCOUNT_CONTAINER_NAME: ${{ vars.STORAGE_ACCOUNT_CONTAINER_NAME }}
        with:
          azcliversion: latest
          inlineScript: |
            storage_account_id=$(az storage account show \
              --name "$STORAGE_ACCOUNT_NAME" \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --query id \
              --output tsv)
            container_id="${storage_account_id}/blobServices/default/containers/${STORAGE_ACCOUNT_CONTAINER_NAME}"
            
            source "${GITHUB_WORKSPACE}/scripts/helper-funcs/role-grants.sh"
            grant_role "Storage Blob Data Contributor" "$container_id"
            sleep 20
          
      - name: Run TF Init
        run: |
          cd environments/dev/
          terraform init -reconfigure
      
      - name: Run TF Apply
        env:
          TF_VAR_admin_username: ${{ secrets.AZURE_VM_ADMIN_USERNAME }}
          TF_VAR_ssh_public_key: ${{ secrets.PUBLIC_SSH_KEY }}
        run: |
          cd environments/dev/
          terraform apply -auto-approve

      - name: Export Ansible connection metadata
        run: |
          cd environments/dev/
          terraform output -json > ../../ansible/terraform-outputs.json
      
      - name: Upload Repo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ansible-hosts
          path: |
            ansible/hosts.ini
            ansible/terraform-outputs.json
          retention-days: 1
      
  configure-environment:
    needs: provision-environment
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure Bastion CLI extension
        run: az extension add --name bastion --upgrade

      - name: Download Repo Artifact
        uses: actions/download-artifact@v4
        with:
          name: ansible-hosts
          path: ansible/

      - name: Configure VMs through Azure Bastion
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          eval "$(ssh-agent -s)"
          tunnel_pids=()
          cleanup() {
            for pid in "${tunnel_pids[@]}"; do
              kill "$pid" 2>/dev/null || true
            done
            ssh-agent -k >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add -

          resource_group="$(jq -r '.resource_group_name.value' ansible/terraform-outputs.json)"
          bastion_name="$(jq -r '.bastion_host_name.value' ansible/terraform-outputs.json)"
          mapfile -t vm_ids < <(jq -r '.vm_ids.value[]' ansible/terraform-outputs.json)

          if [ "${#vm_ids[@]}" -eq 0 ]; then
            echo "Terraform output contains no backend VM IDs." >&2
            exit 1
          fi

          for index in "${!vm_ids[@]}"; do
            port=$((2201 + index))
            log_file="$RUNNER_TEMP/bastion-tunnel-${index}.log"
            az network bastion tunnel \
              --name "$bastion_name" \
              --resource-group "$resource_group" \
              --target-resource-id "${vm_ids[$index]}" \
              --resource-port 22 \
              --port "$port" >"$log_file" 2>&1 &
            tunnel_pids+=("$!")

            ready=false
            for attempt in {1..30}; do
              if ! kill -0 "${tunnel_pids[$index]}" 2>/dev/null; then
                cat "$log_file" >&2
                echo "Azure Bastion tunnel for VM ${index} exited before opening port ${port}." >&2
                exit 1
              fi
              if (echo >"/dev/tcp/127.0.0.1/${port}") >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              cat "$log_file" >&2
              echo "Azure Bastion tunnel did not open local port ${port}." >&2
              exit 1
            fi
          done

          ansible-playbook -i ansible/hosts.ini ansible/playbooks/config-vms.yml
