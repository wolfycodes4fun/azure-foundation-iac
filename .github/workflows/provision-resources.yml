---
name: Environment Create Pipeline

on:
  workflow_dispatch:

jobs:
  create-storage-account:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: |
          cd scripts/
          chmod +x *.sh

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Grant Contributor Role to SPN
        uses: azure/cli@v2
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          azcliversion: latest
          inlineScript: |
            source "$GITHUB_WORKSPACE/scripts/helper-funcs/role-grants.sh"
            grant_role "Contributor" "/subscriptions/${SUBSCRIPTION_ID}" 
      
      - name: Provision Storage Account
        env:
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          REGION: ${{ vars.REGION }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          STORAGE_ACCOUNT_CONTAINER_NAME: ${{ vars.STORAGE_ACCOUNT_CONTAINER_NAME }}
        run: |
          cd scripts/
          ./initialize-container-remote-be.sh

  provision-environment:
    needs: create-storage-account
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Grant Storage Blob Data Contributor role to SPN
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          STORAGE_ACCOUNT_CONTAINER_NAME: ${{ vars.STORAGE_ACCOUNT_CONTAINER_NAME }}
        with:
          azcliversion: latest
          inlineScript: |
            storage_account_id=$(az storage account show \
              --name "$STORAGE_ACCOUNT_NAME" \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --query id \
              --output tsv)
            container_id="${storage_account_id}/blobServices/default/containers/${STORAGE_ACCOUNT_CONTAINER_NAME}"
            
            source "${GITHUB_WORKSPACE}/scripts/helper-funcs/role-grants.sh"
            grant_role "Storage Blob Data Contributor" "$container_id"
            sleep 20
          
      - name: Run TF Init
        run: |
          cd environments/dev/
          terraform init -reconfigure
      
      - name: Run TF Apply
        env:
          TF_VAR_admin_username: ${{ secrets.AZURE_VM_ADMIN_USERNAME }}
          TF_VAR_ssh_public_key: ${{ secrets.PUBLIC_SSH_KEY }}
        run: |
          cd environments/dev/
          terraform apply -auto-approve
      
      - name: Upload Repo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ansible-hosts
          path: |
            ansible/hosts.ini
          retention-days: 1
      
  configure-environment:
    needs: provision-environment
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4
      
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PVT_SSH_KEY }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download Repo Artifact
        uses: actions/download-artifact@v4
        with:
          name: ansible-hosts
          path: ansible/
      
      - name: Open tunnels to Bastion host
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
        with:
          azcliversion: latest
          inlineScript: |
            az extension add --name bastion --upgrade
            # Get the target VM IPs from hosts.ini
            TARGET_IPS=$(grep -oP 'ansible_host=\K[0-9.]+' ansible/hosts.ini)
            HOST_PORT=2222

            # Establish tunnel
            for ip_addr in $TARGET_IPS; do
              az network bastion tunnel \
                --name "az-foundation-iac-dev-bastion-host" \
                --resource-group "$RESOURCE_GROUP_NAME" \
                --target-ip-address "${ip_addr}" \
                --resource-port 22 \
                --port $HOST_PORT &

              HOST_PORT=$((HOST_PORT + 1))
            done

      - name: Configure VMs through Azure Bastion
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
        run: |
          sleep 30
          ansible-playbook -i ansible/hosts.ini ansible/playbooks/config-vms.yml -vvv
